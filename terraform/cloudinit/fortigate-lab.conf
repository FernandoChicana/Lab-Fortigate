config system global
    set hostname "${hostname}"
    set admin-sport ${admin_sport}
    set gui-theme mariner
end
config system admin
    edit "admin"
        set password "${admin_pw}"
    next
end
config system interface
    edit "port1"
        set mode dhcp
        set allowaccess ping https ssh fgfm
        set description "wan"
    next
    edit "port2"
        set mode static
        set ip ${lan_ip} ${lan_mask}
        set allowaccess ping https ssh
        set description "lan-detonation-range"
    next
end
config system dhcp server
    edit 1
        set dns-service default
        set default-gateway ${lan_ip}
        set netmask ${lan_mask}
        set interface "port2"
        config ip-range
            edit 1
                set start-ip ${dhcp_start}
                set end-ip ${dhcp_end}
            next
        end
    next
end
config router static
    edit 1
        set gateway 0.0.0.0
        set device "port1"
        set dst 0.0.0.0 0.0.0.0
        set dynamic-gateway enable
    next
end
# --- Security profiles: use the shipped "flow" defaults but force logging so
#     every detection lands in FortiView and is forwarded to FortiAnalyzer. ----
config antivirus profile
    edit "lab-av"
        set comment "Lab AV — inspect everything, log all"
        config http
            set av-scan block
        end
        config ftp
            set av-scan block
        end
        config smtp
            set av-scan block
        end
        config pop3
            set av-scan block
        end
        config imap
            set av-scan block
        end
        set feature-set flow
    next
end
config ips sensor
    edit "lab-ips"
        set comment "Lab IPS — all signatures, block high/critical, log rest"
        config entries
            edit 1
                set severity high critical
                set status enable
                set action block
                set log enable
                set log-packet enable
            next
            edit 2
                set severity medium low info
                set status enable
                set action default
                set log enable
            next
        end
    next
end
config application list
    edit "lab-appctrl"
        set comment "Lab application control — monitor + log all"
        set other-application-action pass
        set other-application-log enable
        config entries
            edit 1
                set action pass
                set log enable
            next
        end
    next
end
# --- Firewall policy: LAN -> WAN, NAT out, full UTM, log ALL sessions. -------
config firewall policy
    edit 1
        set name "lan-to-internet-inspected"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set av-profile "lab-av"
        set ips-sensor "lab-ips"
        set application-list "lab-appctrl"
        set logtraffic all
        set logtraffic-start enable
        set nat enable
    next
end
# --- Logging to FortiAnalyzer (OFTP 514). Device is authorized on the FAZ side
#     on first contact (Device Manager -> unregistered) or pre-authorized by
#     serial. Real-time upload so detonations show up immediately. -------------
config log fortianalyzer setting
    set status enable
    set server "${faz_ip}"
    set upload-option realtime
    set reliable enable
    %{ if faz_serial != "" ~}
    set serial "${faz_serial}"
    %{ endif ~}
end
config log fortianalyzer filter
    set severity information
    set forward-traffic enable
    set local-traffic enable
end
config log setting
    set fwpolicy-implicit-log enable
    set extended-log enable
end
# --- Security Fabric: this FortiGate is the Fabric ROOT. FortiAnalyzer joins as
#     the logging/analytics member; FortiEDR integrates as a Fabric connector
#     (FortiEDR pushes endpoint telemetry + receives quarantine actions). ------
config system csf
    set status enable
    set group-name "${fabric_group_name}"
    %{ if fabric_psk != "" ~}
    set group-password "${fabric_psk}"
    %{ endif ~}
    set configuration-sync default
    set fabric-object-unification default
    %{ if faz_ip != "" ~}
    set accept-auth-by-cert enable
    config fabric-connector
        edit "fortianalyzer"
            set accprofile "super_admin"
        next
    end
    %{ endif ~}
end
# --- Automation stitch: on an IPS/AV hit, tag the source so FortiEDR / manual
#     playbooks can react. Quarantine automation with FortiEDR is completed in
#     the GUI (Security Fabric > Automation) once FortiEDR is connected. -------
config system automation-trigger
    edit "ips-detected"
        set event-type event-log
        set logid 28704
    next
end
config system automation-action
    edit "quarantine-src"
        set action-type quarantine
    next
end
config system automation-stitch
    edit "ips-quarantine"
        set trigger "ips-detected"
        config actions
            edit 1
                set action "quarantine-src"
            next
        end
    next
end
